<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototipo - Apertura de Sobres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0B1220;
    --bg-pitch: #0F2318;
    --gold: #F5A623;
    --gold-2: #FFD873;
    --coral: #E15B3F;
    --blue: #3E8EDE;
    --purple: #8B5CF6;
    --common: #7C8B99;
    --uncommon: #4FB477;
    --text-light: #F5F1E8;
    --text-dim: #9AA5B8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #05070c;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--text-light);
  }

  .phone {
    width: 390px;
    height: 780px;
    background: #000;
    border-radius: 44px;
    padding: 12px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 2px #1a1a1a;
    position: relative;
  }

  .screen {
    width: 100%;
    height: 100%;
    border-radius: 34px;
    overflow: hidden;
    position: relative;
    background:
      radial-gradient(ellipse 500px 300px at 20% -5%, rgba(245,166,35,0.18), transparent 60%),
      radial-gradient(ellipse 500px 300px at 80% -5%, rgba(62,142,222,0.18), transparent 60%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep) 55%, var(--bg-pitch) 100%);
    display: flex;
    flex-direction: column;
  }

  /* subtle goalpost motif */
  .screen::before, .screen::after {
    content: '';
    position: absolute;
    top: 40px;
    bottom: 30%;
    width: 3px;
    background: linear-gradient(180deg, rgba(255,255,255,0.14), transparent);
    z-index: 0;
  }
  .screen::before { left: 34px; }
  .screen::after { right: 34px; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 22px 0;
    font-size: 13px;
    color: var(--text-dim);
    z-index: 2;
    position: relative;
  }
  .topbar .packs {
    display: flex; align-items: center; gap: 6px;
    font-weight: 600; color: var(--gold-2);
    background: rgba(245,166,35,0.12);
    border: 1px solid rgba(245,166,35,0.3);
    padding: 5px 12px; border-radius: 100px;
  }

  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    padding: 20px;
  }

  .view { display: none; width: 100%; align-items: center; justify-content: center; flex-direction: column; }
  .view.active { display: flex; }

  /* ---- Closed pack ---- */
  .pack {
    width: 190px;
    height: 260px;
    border-radius: 18px;
    background: linear-gradient(135deg, #16233b, #0c1526);
    border: 2px solid rgba(245,166,35,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    animation: idlePulse 2.4s ease-in-out infinite;
    box-shadow: 0 0 40px rgba(245,166,35,0.15);
  }
  @keyframes idlePulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(245,166,35,0.12); }
    50% { transform: scale(1.03); box-shadow: 0 0 50px rgba(245,166,35,0.28); }
  }
  .pack-star {
    width: 70px; height: 70px;
    background: radial-gradient(circle, var(--gold-2), var(--gold) 60%, transparent 75%);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    opacity: 0.9;
  }
  .pack-rays {
    position: absolute; inset: 0;
    background: repeating-conic-gradient(from 0deg, rgba(245,166,35,0.08) 0deg 8deg, transparent 8deg 20deg);
    border-radius: 16px;
    animation: rotateRays 12s linear infinite;
  }
  @keyframes rotateRays { to { transform: rotate(360deg); } }

  .cta-label {
    margin-top: 26px;
    font-family: 'Anton', sans-serif;
    font-size: 20px;
    letter-spacing: 1px;
    color: var(--text-light);
    animation: fadePulse 1.8s ease-in-out infinite;
  }
  @keyframes fadePulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
  .cta-sub { margin-top: 6px; font-size: 12px; color: var(--text-dim); }

  /* ---- Rip flash ---- */
  .flash {
    position: absolute; inset: 0;
    background: white;
    opacity: 0;
    z-index: 10;
    pointer-events: none;
  }
  .flash.active { animation: flashPop 0.5s ease-out; }
  @keyframes flashPop {
    0% { opacity: 0; }
    15% { opacity: 0.95; }
    100% { opacity: 0; }
  }

  /* ---- Reveal view ---- */
  .progress {
    display: flex; gap: 8px; margin-bottom: 28px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: all 0.3s;
  }
  .dot.done { background: var(--gold); }
  .dot.current { background: var(--text-light); transform: scale(1.3); }

  .card-wrap {
    width: 220px;
    height: 300px;
    perspective: 1200px;
    cursor: pointer;
    transition: transform 0.35s ease-out;
    transform-style: preserve-3d;
  }
  .card-wrap.tilting { transition: none; }
  .card-inner {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(.34,1.56,.64,1);
  }
  .card-inner.flipped { transform: rotateY(180deg); }

  /* holographic interactive shine, follows pointer/gyro */
  .holo-shine {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s;
    background:
      radial-gradient(circle at var(--sx, 50%) var(--sy, 50%), rgba(255,255,255,0.85), transparent 45%),
      conic-gradient(from calc(var(--sx, 50%) * 3.6deg) at var(--sx, 50%) var(--sy, 50%),
        #ff8fd6, #ffe38f, #8fffcf, #8fd6ff, #c48fff, #ff8fd6);
    mix-blend-mode: color-dodge;
    background-blend-mode: screen, normal;
  }
  .card-front.holo .holo-shine { opacity: 0.55; }
  .card-wrap.tilting .holo-shine { opacity: 0.85; }

  .tilt-hint {
    margin-top: 14px; font-size: 11px; color: var(--gold-2);
    opacity: 0; transition: opacity 0.3s;
    display: flex; align-items: center; gap: 6px;
  }
  .tilt-hint.show { opacity: 1; }
  .gyro-btn {
    margin-top: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--text-light);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    padding: 7px 16px;
    border-radius: 100px;
    cursor: pointer;
    display: none;
  }
  .gyro-btn.show { display: inline-block; }

  .card-face {
    position: absolute; inset: 0;
    border-radius: 16px;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px solid rgba(255,255,255,0.25);
    overflow: hidden;
  }

  .card-back {
    background: linear-gradient(135deg, #16233b, #0c1526);
  }
  .card-back .mini-star {
    width: 60px; height: 60px;
    background: radial-gradient(circle, var(--gold-2), var(--gold) 60%, transparent 75%);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    opacity: 0.85;
  }

  .card-front {
    transform: rotateY(180deg);
    padding: 18px;
    text-align: center;
  }

  .rarity-badge {
    font-family: 'Anton', sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
    padding: 4px 10px;
    border-radius: 100px;
    background: rgba(0,0,0,0.25);
    margin-bottom: 10px;
  }

  .player-icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif;
    font-size: 24px;
    margin-bottom: 14px;
    border: 2px solid rgba(255,255,255,0.4);
  }

  .player-name {
    font-family: 'Anton', sans-serif;
    font-size: 18px;
    letter-spacing: 0.5px;
    line-height: 1.15;
  }
  .player-team { font-size: 11px; opacity: 0.85; margin-top: 4px; }
  .player-pos { font-size: 11px; opacity: 0.7; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; }

  /* holo shimmer */
  .card-front.holo::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.55) 40%, transparent 60%);
    background-size: 250% 250%;
    animation: shimmer 2.2s ease-in-out infinite;
    mix-blend-mode: overlay;
  }
  @keyframes shimmer {
    0% { background-position: -50% -50%; }
    100% { background-position: 150% 150%; }
  }

  .continue-hint {
    margin-top: 26px; font-size: 12px; color: var(--text-dim);
  }

  /* particle burst */
  .particle {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 20;
  }
  @keyframes burst {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }

  .shake { animation: screenShake 0.5s ease-in-out; }
  @keyframes screenShake {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-4px, 2px); }
    40% { transform: translate(4px, -2px); }
    60% { transform: translate(-3px, 1px); }
    80% { transform: translate(3px, -1px); }
  }

  /* ---- Summary view ---- */
  .summary-title {
    font-family: 'Anton', sans-serif;
    font-size: 24px;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .summary-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 22px; }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    width: 100%;
    padding: 0 8px;
    margin-bottom: 30px;
  }
  .mini-card {
    aspect-ratio: 2/3;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Anton', sans-serif;
    font-size: 16px;
    border: 1.5px solid rgba(255,255,255,0.3);
    position: relative;
  }
  .mini-card.holo::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.5) 45%, transparent 65%);
    background-size: 250% 250%;
    animation: shimmer 2.2s ease-in-out infinite;
    mix-blend-mode: overlay;
    border-radius: 8px;
  }

  .btn {
    font-family: 'Anton', sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--bg-deep);
    background: linear-gradient(135deg, var(--gold-2), var(--gold));
    border: none;
    padding: 14px 32px;
    border-radius: 100px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(245,166,35,0.35);
    transition: transform 0.15s;
  }
  .btn:active { transform: scale(0.96); }
  .btn:disabled {
    background: rgba(255,255,255,0.15);
    color: var(--text-dim);
    box-shadow: none;
    cursor: not-allowed;
  }

  .btn-secondary {
    margin-top: 12px;
    background: none;
    border: 1px solid rgba(255,255,255,0.25);
    color: var(--text-light);
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 12px;
    padding: 10px 20px;
    border-radius: 100px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="screen" id="screen">
    <div class="topbar">
      <label style="display:flex; align-items:center; gap:5px; font-size:10px; cursor:pointer;">
        <input type="checkbox" id="forceHoloToggle" style="accent-color:#F5A623;"> Forzar holo (prueba)
      </label>
      <span class="packs">&#9733; <span id="packCount">5</span> sobres</span>
    </div>

    <div class="stage">
      <div class="flash" id="flash"></div>

      <!-- Closed pack -->
      <div class="view active" id="closedView">
        <div class="pack" id="packEl" onclick="openPack()">
          <div class="pack-rays"></div>
          <div class="pack-star"></div>
        </div>
        <div class="cta-label">TOCA PARA ABRIR</div>
        <div class="cta-sub">Sobre estandar &middot; 5 cartas</div>
      </div>

      <!-- Reveal -->
      <div class="view" id="revealView">
        <div class="progress" id="progress"></div>
        <div class="card-wrap" id="cardWrap" onclick="handleCardClick(event)">
          <div class="card-inner" id="cardInner">
            <div class="card-face card-back">
              <div class="mini-star"></div>
            </div>
            <div class="card-face card-front" id="cardFront">
              <div class="holo-shine" id="holoShine"></div>
            </div>
          </div>
        </div>
        <div class="continue-hint" id="continueHint">Toca la carta para revelar</div>
        <div class="tilt-hint" id="tiltHint">&#10022; Mueve el dedo sobre la carta para ver el efecto</div>
        <button class="gyro-btn" id="gyroBtn" onclick="enableGyro(event)">Usar giroscopio del celular</button>
      </div>

      <!-- Summary -->
      <div class="view" id="summaryView">
        <div class="summary-title">SOBRE COMPLETO</div>
        <div class="summary-sub" id="summarySub">Revisa lo que conseguiste</div>
        <div class="summary-grid" id="summaryGrid"></div>
        <button class="btn" id="openAnotherBtn" onclick="resetToClosedOrEmpty()">ABRIR OTRO SOBRE</button>
        <button class="btn-secondary" onclick="watchAdForPacks()">+2 sobres viendo un anuncio</button>
      </div>
    </div>
  </div>
</div>

<script>
const RARITIES = {
  common:    { label: 'Comun',        color: '#7C8B99', icon: '&#9670;',        weight: 60 },
  uncommon:  { label: 'Poco comun',   color: '#4FB477', icon: '&#9670;&#9670;', weight: 25 },
  rare:      { label: 'Rara',         color: '#3E8EDE', icon: '&#9733;',        weight: 10 },
  superrare: { label: 'Super rara',   color: '#8B5CF6', icon: '&#9733;&#9733;', weight: 4  },
  holo:      { label: 'Holografica',  color: '#F5A623', icon: '&#10022;',       weight: 1  }
};
// Ultima carta del sobre: mas probabilidad de algo bueno (como en TCGP)
const LAST_SLOT_RARITIES = { common: 20, uncommon: 35, rare: 28, superrare: 13, holo: 4 };

const POSITIONS = ['Delantero', 'Mediocampista', 'Defensa Central', 'Portero', 'Extremo'];
const TEAMS = ['FC Condor', 'Real Trueno', 'Atletico Sol', 'Deportivo Aguila', 'Union Fenix', 'Club Andino'];
const INITIALS = ['MJ','RS','DC','LT','AV','PG','FN','KO','HB','WM'];

function weightedPick(table) {
  const keys = Object.keys(table);
  const total = keys.reduce((a, k) => a + table[k], 0);
  let r = Math.random() * total;
  for (const key of keys) {
    if (r < table[key]) return key;
    r -= table[key];
  }
  return keys[keys.length - 1]; // respaldo por si el redondeo deja r sin caer en ningun rango
}

function generatePack() {
  const forceHolo = document.getElementById('forceHoloToggle').checked;
  const cards = [];
  for (let i = 0; i < 5; i++) {
    const isLast = i === 4;
    const rarityKey = (isLast && forceHolo) ? 'holo' : weightedPick(isLast ? LAST_SLOT_RARITIES : RARITIES);
    cards.push({
      rarity: rarityKey,
      name: INITIALS[Math.floor(Math.random()*INITIALS.length)] + '. ' + ['Rios','Vega','Toro','Cruz','Leon','Sosa'][Math.floor(Math.random()*6)],
      team: TEAMS[Math.floor(Math.random()*TEAMS.length)],
      pos: POSITIONS[Math.floor(Math.random()*POSITIONS.length)]
    });
  }
  return cards;
}

let packCount = 5;
let currentPack = [];
let currentIndex = 0;
let flipped = false;

const closedView = document.getElementById('closedView');
const revealView = document.getElementById('revealView');
const summaryView = document.getElementById('summaryView');
const screen = document.getElementById('screen');

function showView(view) {
  [closedView, revealView, summaryView].forEach(v => v.classList.remove('active'));
  view.classList.add('active');
}

function updatePackCount() {
  document.getElementById('packCount').textContent = packCount;
  document.getElementById('packEl').style.opacity = packCount > 0 ? '1' : '0.35';
  document.getElementById('packEl').style.pointerEvents = packCount > 0 ? 'auto' : 'none';
}

function openPack() {
  if (packCount <= 0) return;
  packCount--;
  updatePackCount();

  const flash = document.getElementById('flash');
  flash.classList.remove('active');
  void flash.offsetWidth;
  flash.classList.add('active');

  setTimeout(() => {
    currentPack = generatePack();
    currentIndex = 0;
    renderProgress();
    setupCard();
    showView(revealView);
  }, 220);
}

function renderProgress() {
  const progress = document.getElementById('progress');
  progress.innerHTML = '';
  for (let i = 0; i < currentPack.length; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < currentIndex ? ' done' : '') + (i === currentIndex ? ' current' : '');
    progress.appendChild(d);
  }
}

function setupCard() {
  flipped = false;
  const inner = document.getElementById('cardInner');
  inner.classList.remove('flipped');
  document.getElementById('continueHint').textContent = 'Toca la carta para revelar';
  document.getElementById('tiltHint').classList.remove('show');
  document.getElementById('gyroBtn').classList.remove('show');
  resetTilt();

  const card = currentPack[currentIndex];
  const r = RARITIES[card.rarity] || RARITIES.common;
  const front = document.getElementById('cardFront');
  front.className = 'card-face card-front' + (card.rarity === 'holo' ? ' holo' : '');
  front.style.background = card.rarity === 'holo'
    ? 'linear-gradient(135deg, #F5A623, #E15B3F 50%, #8B5CF6)'
    : `linear-gradient(135deg, ${r.color}dd, ${r.color}88)`;
  front.innerHTML = `
    <div class="holo-shine" id="holoShine"></div>
    <div class="rarity-badge">${r.icon} ${r.label.toUpperCase()}</div>
    <div class="player-icon">${card.name.split('.')[0]}</div>
    <div class="player-name">${card.name}</div>
    <div class="player-team">${card.team}</div>
    <div class="player-pos">${card.pos}</div>
  `;
}

function flipCurrent() {
  if (flipped) {
    nextCard();
    return;
  }
  flipped = true;
  document.getElementById('cardInner').classList.add('flipped');
  document.getElementById('continueHint').textContent = 'Toca para continuar';

  const card = currentPack[currentIndex];
  if (card.rarity === 'holo' || card.rarity === 'superrare') {
    burstParticles(card.rarity === 'holo' ? 28 : 16, RARITIES[card.rarity].color);
    screen.classList.remove('shake');
    void screen.offsetWidth;
    screen.classList.add('shake');
  }
  if (card.rarity === 'holo') {
    document.getElementById('tiltHint').classList.add('show');
    document.getElementById('gyroBtn').classList.add('show');
  }
}

/* ---- Tilt / holographic interaction ---- */
const cardWrap = document.getElementById('cardWrap');
let dragActive = false;
let dragStart = null;
let dragMoved = false;

function isCurrentHoloFlipped() {
  return flipped && currentPack[currentIndex] && currentPack[currentIndex].rarity === 'holo';
}

function applyTilt(px, py) {
  // px, py normalized -1..1 relative to card center
  const holoShine = document.getElementById('holoShine');
  cardWrap.classList.add('tilting');
  const rx = px * 14;
  const ry = -py * 14;
  cardWrap.style.transform = `rotateX(${ry}deg) rotateY(${rx}deg)`;
  if (holoShine) {
    holoShine.style.setProperty('--sx', `${(px + 1) / 2 * 100}%`);
    holoShine.style.setProperty('--sy', `${(py + 1) / 2 * 100}%`);
  }
}

function resetTilt() {
  cardWrap.classList.remove('tilting');
  cardWrap.style.transform = '';
}

function handleCardClick(e) {
  // Ignore click if it was actually the end of a drag
  if (dragMoved) { dragMoved = false; return; }
  flipCurrent();
}

cardWrap.addEventListener('pointerdown', (e) => {
  if (!isCurrentHoloFlipped()) return;
  dragActive = true;
  dragMoved = false;
  cardWrap.setPointerCapture(e.pointerId);
});

cardWrap.addEventListener('pointermove', (e) => {
  if (!dragActive || !isCurrentHoloFlipped()) return;
  const rect = cardWrap.getBoundingClientRect();
  const px = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  const py = ((e.clientY - rect.top) / rect.height) * 2 - 1;
  if (Math.abs(px) > 0.05 || Math.abs(py) > 0.05) dragMoved = true;
  applyTilt(px, py);
});

function endDrag() {
  if (!dragActive) return;
  dragActive = false;
  resetTilt();
  setTimeout(() => { dragMoved = false; }, 50);
}
cardWrap.addEventListener('pointerup', endDrag);
cardWrap.addEventListener('pointerleave', endDrag);
cardWrap.addEventListener('pointercancel', endDrag);

function enableGyro(e) {
  e.stopPropagation();
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(state => {
      if (state === 'granted') attachGyro();
    }).catch(() => {});
  } else {
    attachGyro();
  }
}

function attachGyro() {
  window.addEventListener('deviceorientation', (e) => {
    if (!isCurrentHoloFlipped()) return;
    const py = Math.max(-1, Math.min(1, (e.beta - 45) / 35));
    const px = Math.max(-1, Math.min(1, e.gamma / 35));
    applyTilt(px, py);
  });
  document.getElementById('gyroBtn').textContent = 'Giroscopio activo';
}

function nextCard() {
  currentIndex++;
  if (currentIndex >= currentPack.length) {
    renderSummary();
    showView(summaryView);
    return;
  }
  renderProgress();
  setupCard();
}

function burstParticles(count, color) {
  const stage = document.querySelector('.stage');
  const rect = document.getElementById('cardInner').getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();
  const cx = rect.left - stageRect.left + rect.width/2;
  const cy = rect.top - stageRect.top + rect.height/2;

  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 100;
    p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.background = color;
    p.style.animation = `burst ${0.6 + Math.random()*0.5}s ease-out forwards`;
    stage.appendChild(p);
    setTimeout(() => p.remove(), 1200);
  }
}

function renderSummary() {
  const grid = document.getElementById('summaryGrid');
  grid.innerHTML = '';
  let bestRarity = 'common';
  const order = ['common','uncommon','rare','superrare','holo'];
  currentPack.forEach(card => {
    if (order.indexOf(card.rarity) > order.indexOf(bestRarity)) bestRarity = card.rarity;
    const r = RARITIES[card.rarity];
    const mini = document.createElement('div');
    mini.className = 'mini-card' + (card.rarity === 'holo' ? ' holo' : '');
    mini.style.background = card.rarity === 'holo'
      ? 'linear-gradient(135deg, #F5A623, #E15B3F 50%, #8B5CF6)'
      : `linear-gradient(135deg, ${r.color}dd, ${r.color}88)`;
    mini.innerHTML = r.icon;
    grid.appendChild(mini);
  });
  const sub = document.getElementById('summarySub');
  sub.textContent = bestRarity === 'holo'
    ? 'Increible, conseguiste una carta HOLOGRAFICA'
    : bestRarity === 'superrare'
    ? 'Muy buena tanda, salio una SUPER RARA'
    : 'Sigue abriendo sobres para completar tu album';

  document.getElementById('openAnotherBtn').disabled = packCount <= 0;
}

function resetToClosedOrEmpty() {
  showView(closedView);
}

function watchAdForPacks() {
  packCount += 2;
  updatePackCount();
  document.getElementById('openAnotherBtn').disabled = packCount <= 0;
}

updatePackCount();
